apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetria-uci
  namespace: hospitvalle
  labels:
    app: telemetria-uci
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telemetria-uci
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: telemetria-uci
    spec:
      containers:
        - name: telemetria
          image: hospitvalle/telemetria:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
