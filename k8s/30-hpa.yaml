apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetria-uci
  namespace: hospitvalle
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetria-uci
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
